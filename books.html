<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:Arial, Helvetica, sans-serif;
            
        }
        body{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(to right,#3f5efb,#fc466b); */
            background: linear-gradient(to right,#141e30, #243b55);
            /* background: linear-gradient(to right, #232526, #ff416c); */
            /* background: linear-gradient(to right, #8e2de2, #ff6a88); */
            /* background: linear-gradient(to right, #11998e, #38ef7d); */
            /* background: linear-gradient(to right, #ff9966, #ff5e62); */
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
        }
        form{
            width: 30rem;
            height: 35rem;
            padding-top: 30px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(31,38,135,.37);
            border-radius: 30px;
            border-left: 1px solid rgba(255, 255, 255, .3);
            border-top: 1px solid rgba(255, 255, 255, .3) ;
        }
        .back-btn{
            width: fit-content;
            margin-left: 5px ;
            

            color: white;
            text-decoration: none;

            font-size: 13px;
            font-weight: bold;

            padding: 5px 11px;

            border-radius: 15px;

            background: rgba(255,255,255,0.1);

            border: 1px solid rgba(255,255,255,0.2);

            transition: 0.3s ease;
        }

        .back-btn:hover{
            background: white;
            color: #243b55;
        }
        h1{
            font-size: 45px;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,.2);
            letter-spacing: 3px;
            margin-bottom: 5%;
            opacity: .7;
        }
     
        
        label{
            width: 65%;
            margin: 8px auto 0 auto;
            margin-left: 45px ;

            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;

            opacity: 0.9;
            text-align: left;

            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        input{
            width: 65%;
            margin: 10px auto 19px auto;
            margin-left: 55px ;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            opacity: .8;
        }

        button{
            width: 30%;
            margin: 1% auto;
            margin-right: 50px;
            padding: 12px 30px;
            background: #ffffff;
            color: #3f5efb;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);

            transition: 0.3s ease;

            }

        button:hover{
            background: #3f5efb;
            color: white;
            transform: scale(1.05);
            }
        
    </style>

</head>
<body>
    <form>
        <a href="#" class="back-btn"> &larr; Back</a>
        <h1>Add Book</h1>
        <label>Book_Id : </label><input type="text" placeholder="Enter Book_Id"><br>
        <label>Title : </label><input type="text" placeholder="Enter the Book Title"><br>
        <label>Author : </label><input type="text" placeholder="Enter the Book Author"><br>
        <label>Quantity :</label><input type="number" placeholder="Enter the Book Quantity">
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
